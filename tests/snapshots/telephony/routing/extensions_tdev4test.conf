; Loop PBX tenant dialplan tdev4test. Generated by the CRM compiler; do not edit.

; Tag the call and derive LOOP_CALL_ID unless the CRM pre-assigned one (contract section 3).
[tdev4test-sub-entry]
exten => s,1,Set(__LOOP_TENANT=tdev4test)
 same => n,ExecIf($["${LOOP_CALL_ID}" = ""]?Set(_LOOP_H=${SHA1(loop-call:${LOOP_TENANT}:${CHANNEL(linkedid)})}))
 same => n,ExecIf($["${LOOP_CALL_ID}" = ""]?Set(__LOOP_CALL_ID=${LOOP_H:0:8}-${LOOP_H:8:4}-${LOOP_H:12:4}-${LOOP_H:16:4}-${LOOP_H:20:12}))
 same => n,Return()

[tdev4test-sub-agent-headers]
exten => s,1,Set(PJSIP_HEADER(add,X-Loop-Call-Id)=${LOOP_CALL_ID})
 same => n,Return()

; A paused agent (PUT /telephony/agents/me/status) is not rung: the worker
; sets the extension's agent device to BUSY (contract section 6).
[tdev4test-internal]
exten => 100,1,Gosub(tdev4test-sub-entry,s,1)
 same => n,GotoIf($["${DEVICE_STATE(Stasis:tdev4test_100-agent)}" = "BUSY"]?paused)
 same => n,Dial(PJSIP/tdev4test_100,30,b(tdev4test-sub-agent-headers^s^1)m)
 same => n,Hangup()
 same => n(paused),Hangup(17)
exten => 101,1,Gosub(tdev4test-sub-entry,s,1)
 same => n,GotoIf($["${DEVICE_STATE(Stasis:tdev4test_101-agent)}" = "BUSY"]?paused)
 same => n,Dial(PJSIP/tdev4test_101,30,b(tdev4test-sub-agent-headers^s^1)m)
 same => n,Hangup()
 same => n(paused),Hangup(17)
exten => _X.,1,Hangup(1)
exten => _+X.,1,Hangup(1)
exten => i,1,Hangup(1)

; Queue members ring through here; a paused agent answers busy.
[tdev4test-agent]
exten => 100,1,GotoIf($["${DEVICE_STATE(Stasis:tdev4test_100-agent)}" = "BUSY"]?paused)
 same => n,Dial(PJSIP/tdev4test_100,,b(tdev4test-sub-agent-headers^s^1))
 same => n,Hangup()
 same => n(paused),Hangup(17)
exten => 101,1,GotoIf($["${DEVICE_STATE(Stasis:tdev4test_101-agent)}" = "BUSY"]?paused)
 same => n,Dial(PJSIP/tdev4test_101,,b(tdev4test-sub-agent-headers^s^1))
 same => n,Hangup()
 same => n(paused),Hangup(17)
exten => _X.,1,Hangup(1)
exten => _+X.,1,Hangup(1)
exten => i,1,Hangup(1)

; Business hours: Office (Asia/Baghdad)
[tdev4test-sub-hours-5e1f0a2b]
exten => s,1,Set(LOOP_OPEN=0)
 same => n,GotoIf($["${STRFTIME(${EPOCH},Asia/Baghdad,%Y-%m-%d)}" = "2026-12-25"]?done)
 same => n,GotoIfTime(09:00-16:59,mon&tue&wed&thu&sun,*,*,Asia/Baghdad?open)
 same => n,Goto(done)
 same => n(open),Set(LOOP_OPEN=1)
 same => n(done),Return()

; IVR menu: Main
[tdev4test-ivr-0a1b2c3d]
exten => s,1,Set(LOOP_IVR_TRIES=0)
 same => n,Answer()
 same => n(menu),Background(loop/ivr-welcome-ar)
 same => n,WaitExten(5)
exten => 0,1,Hangup()
exten => 1,1,Goto(tdev4test-queue-9f8e7d6c,s,1)
exten => 2,1,Goto(tdev4test-internal,101,1)
exten => t,1,Goto(tdev4test-queue-9f8e7d6c,s,1)
exten => i,1,Set(LOOP_IVR_TRIES=$[${LOOP_IVR_TRIES} + 1])
 same => n,GotoIf($[${LOOP_IVR_TRIES} > 2]?t,1)
 same => n,Goto(s,menu)
exten => _X.,1,Hangup(1)
exten => _+X.,1,Hangup(1)

