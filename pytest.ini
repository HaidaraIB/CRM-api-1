[pytest]
DJANGO_SETTINGS_MODULE = crm_saas_api.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
# -n auto: one worker per core (pytest-xdist). --nomigrations: build the test DB
# from models instead of replaying ~300 migrations per worker (no RunSQL or
# triggers exist; outcomes were verified identical). Debug a single test with
# `-n 0`; check migrations themselves with `-n 0 --migrations` or `makemigrations --check`.
# --timeout: a hung test fails with its stack trace instead of stalling the run
# (pytest-timeout); a normal full run takes about a minute.
addopts = -v --tb=short -n auto --nomigrations --timeout=120
markers =
    real_on_commit: use real transaction.on_commit (no test-time immediate flush)
    real_time_bucket: do not pin the sync 30s version-token time bucket
    allow_network: let this test resolve and reach non-loopback hosts

