<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 24px; color: #1f1f2e; }
        .box { max-width: 560px; margin: 0 auto; border: 1px solid #e5e0f5; border-radius: 12px; padding: 24px; }
        h1 { font-size: 20px; margin-top: 0; }
        dl { margin: 16px 0; }
        dt { font-weight: 600; margin-top: 8px; }
        dd { margin: 4px 0 0 0; }
    </style>
</head>
<body>
    <div class="box">
        <h1>حجز عرض جديد #{{ booking_id }}</h1>
        <p>مرحباً {{ greeting_name }}،</p>
        <p>حجز زائر جلسة شرح النظام. يرجى التواصل معه للتأكيد.</p>
        <dl>
            <dt>الاسم</dt><dd>{{ guest_name }}</dd>
            <dt>البريد</dt><dd>{{ guest_email }}</dd>
            <dt>الهاتف</dt><dd>{{ guest_phone }}</dd>
            <dt>الشركة</dt><dd>{{ company_name }}</dd>
            <dt>الموعد</dt><dd>{{ session_time }}</dd>
            <dt>ملاحظات</dt><dd>{{ notes }}</dd>
        </dl>
    </div>
</body>
</html>
